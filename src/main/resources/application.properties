# 1. URL de conexión (cambia 'nombre_tu_db' por el nombre real de tu base de datos)
spring.datasource.url=jdbc:mysql://localhost:3306/reporteExcel?serverTimezone=UTC&useSSL=false&createDatabaseIfNotExist=true

# 2. Credenciales de acceso
spring.datasource.username=root
spring.datasource.password=Lucca2026

# 3. Driver de MySQL (Spring Boot suele detectarlo, pero es mejor definirlo)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 4. Configuración de Hibernate / JPA
# update: Crea las tablas si no existen o las actualiza sin borrar datos.
# create-drop: Borra y crea todo cada vez que inicias (ideal para pruebas).
spring.jpa.hibernate.ddl-auto=update

# 5. Mostrar las consultas SQL en la consola (útil para debugear)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Asegúrate de que el nivel de log no esté en DEBUG para SQL
logging.level.org.hibernate.SQL=ERROR
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=ERROR

# 6. Dialecto para que Hibernate hable "MySQL moderno"
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

