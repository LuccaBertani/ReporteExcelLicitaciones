server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Como usamos react-router con BrowserRouter, cualquier ruta que no sea
    # un archivo real (/dashboard, /upload, /login, etc.) tiene que devolver
    # index.html para que React Router la resuelva del lado del cliente.
    # Sin esto, refrescar la página en /dashboard te tira un 404 de nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
