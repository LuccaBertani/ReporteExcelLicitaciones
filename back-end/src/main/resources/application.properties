# 1. URL de conexion (por defecto usa localhost para desarrollo local;
#    en Docker se sobreescribe con la variable de entorno SPRING_DATASOURCE_URL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/licitacionesDB?serverTimezone=UTC&useSSL=false&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true}
server.servlet.context-path=/api/v1
# Railway (y la mayoría de plataformas cloud) inyectan su propio puerto vía la
# variable de entorno PORT. Local/Docker sigue usando 8080 por defecto.
server.port=${PORT:8080}

# 2. Credenciales de acceso (sobreescribibles por variables de entorno)
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Lucca2026}

# 3. Driver de MySQL (Spring Boot suele detectarlo, pero es mejor definirlo)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 4. Configuracion de Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update

# 5. Mostrar las consultas SQL en la consola
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

logging.level.org.hibernate.SQL=ERROR
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=ERROR

# 6. Dialecto para que Hibernate hable MySQL moderno
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# 7. Limite de tamano para carga de archivos Excel
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

excel.header = [Seccion, Ramo, Fecha, Numero, Cliente, Riesgo, Status, Estado Motivo, Motivo, AdjudicadoA, Moneda, MontoAdjudicado, MontoCotizado, CotizadoCosto1, CotizadoCosto2, AdjudicadoCosto1, AdjudicadoCosto2, AdjudicadoCosto3]

#La posicion del array indica el renglon de cada riesgo
excel.renglon.riesgo = [RC COMPRENSIVA, RC ASCENSORES, RC CALDERAS, RC GUARDA/DEPOSITO, RC CARTELES, INCENDIO, TECNICO EQ. ELECTRONICOS, APC, ROBO Y RIESGOS SIMILARES, VALORES EN TRANSITO, VALORES EN CAJA, TR INSTRUMENTOS MUSICALES, TR OBRAS DE ARTE, DRONES, INTEGRAL, AERONAVEACION, CAUCION, TRO, TRANSPORTE, SEPELIO, VIDA, SALUD, FRANQUICIAS]
